# Spike S3 overlay: a throwaway GitLab, Oathkeeper from the test compose,
# and the spike_s3_gitlab.py checks. Not named compose*.yml: it is not
# valid on its own. GitLab runs under /gitlab, as the integrated GitLab
# of DTaaS does: browsers use http://gitlab.test/gitlab, containers
# http://gitlab/gitlab. The spike container takes the network alias
# login-relay, so do not start the real login-relay with it.
#
# Usage: see identity-spike/README.md.

services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.1-ce.0
    hostname: gitlab.test
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: ${SPIKE_USER_PASSWORD:-Spike-s3-Passw0rd-x7}
      SPIKE_ADMIN_TOKEN: ${SPIKE_ADMIN_TOKEN:-glpat-spike-s3-admin-token-0001}
      SPIKE_USER_PASSWORD: ${SPIKE_USER_PASSWORD:-Spike-s3-Passw0rd-x7}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.test/gitlab'
        gitlab_rails['gitlab_signup_enabled'] = false
        gitlab_rails['usage_ping_enabled'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
    volumes:
      - ./identity-spike/gitlab_bootstrap.rb:/spike/gitlab_bootstrap.rb:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/gitlab/-/readiness"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      users:
        aliases:
          - gitlab.test

  # The test compose's Oathkeeper, unchanged, without its Keycloak and
  # login-relay dependencies: the spike container answers as login-relay.
  oathkeeper:
    depends_on: !reset {}

  spike-gitlab:
    build:
      context: ./identity-spike
    entrypoint: ["python", "spike_s3_gitlab.py"]
    environment:
      GITLAB_URL: http://gitlab.test/gitlab
      GITLAB_INTERNAL_URL: http://gitlab/gitlab
      SPIKE_ADMIN_TOKEN: ${SPIKE_ADMIN_TOKEN:-glpat-spike-s3-admin-token-0001}
      SPIKE_USER_PASSWORD: ${SPIKE_USER_PASSWORD:-Spike-s3-Passw0rd-x7}
      OATHKEEPER_URL: http://oathkeeper:4456
    volumes:
      - spike-identity-out:/spike-out
    networks:
      users:
        aliases:
          - login-relay
    depends_on:
      gitlab:
        condition: service_healthy

volumes:
  spike-identity-out:
